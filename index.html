<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tchoukball Stats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4 md:p-8 flex flex-col min-h-screen">

    <div class="max-w-7xl mx-auto w-full flex-grow flex flex-col gap-5">

        <!-- ============ HEADER ============ -->
        <header class="glass-card app-header">
            <div class="header-left">
                <div class="brand-mark">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>
                    </svg>
                </div>
                <div>
                    <h1 class="brand-title">Tchoukball Stats</h1>
                    <p class="brand-subtitle">Team &amp; tournament analytics platform</p>
                </div>
            </div>
            <div class="header-right">
                <div class="header-stats hidden lg:flex">
                    <div class="stat-pill">
                        <span class="stat-pill-value" id="stat-teams">0</span>
                        <span class="stat-pill-label">Teams</span>
                    </div>
                    <div class="stat-pill">
                        <span class="stat-pill-value" id="stat-players">0</span>
                        <span class="stat-pill-label">Players</span>
                    </div>
                    <div class="stat-pill">
                        <span class="stat-pill-value" id="stat-matches">0</span>
                        <span class="stat-pill-label">Matches</span>
                    </div>
                </div>
                <button onclick="ui.openSettings()" class="btn-settings">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    Settings
                </button>
            </div>
        </header>

        <!-- ============ ACTION CARDS ============ -->
        <section id="action-cards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

            <!-- BROWSE -->
            <div class="glass-card action-card" data-card="browse">
                <div class="card-header">
                    <div class="card-icon card-icon-browse">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="card-title">Browse</h2>
                        <p class="card-desc">Explore all records</p>
                    </div>
                </div>
                <div class="card-body">
                    <button onclick="ui.openBrowser('teams')" class="btn-action">Teams</button>
                    <button onclick="ui.openBrowser('clubs')" class="btn-action">Clubs</button>
                    <button onclick="ui.openBrowser('players')" class="btn-action-highlight"><span>Players</span></button>
                    <button onclick="ui.openBrowser('rosters')" class="btn-action">Rosters</button>
                    <button onclick="ui.openBrowser('matches')" class="btn-action">Matches</button>
                    <button onclick="ui.openBrowser('tournaments')" class="btn-action">Tournaments</button>
                </div>
            </div>

            <!-- ADD -->
            <div class="glass-card action-card" data-card="add">
                <div class="card-header">
                    <div class="card-icon card-icon-add">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="card-title">Add New</h2>
                        <p class="card-desc">Create a record</p>
                    </div>
                </div>
                <div class="card-body">
                    <button onclick="ui.openForm('add-team')" class="btn-action">Team</button>
                    <button onclick="ui.openForm('add-club')" class="btn-action">Club</button>
                    <button onclick="ui.openForm('add-player')" class="btn-action">Player</button>
                    <button onclick="ui.openForm('add-match')" class="btn-action">Match Fixture</button>
                    <button onclick="ui.openForm('add-tournament')" class="btn-action">Tournament</button>
                </div>
            </div>

            <!-- EDIT -->
            <div class="glass-card action-card" data-card="edit">
                <div class="card-header">
                    <div class="card-icon card-icon-edit">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                            <path d="m15 5 4 4"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="card-title">Edit</h2>
                        <p class="card-desc">Modify details</p>
                    </div>
                </div>
                <div class="card-body">
                    <button onclick="ui.openSelector('edit-team')" class="btn-action">Teams</button>
                    <button onclick="ui.openSelector('edit-club')" class="btn-action">Clubs</button>
                    <button onclick="ui.openSelector('edit-player')" class="btn-action">Players</button>
                    <button onclick="ui.openSelector('edit-match')" class="btn-action">Matches</button>
                    <button onclick="ui.openSelector('edit-tournament')" class="btn-action">Tournaments</button>
                </div>
            </div>

            <!-- REMOVE -->
            <div class="glass-card action-card" data-card="remove">
                <div class="card-header">
                    <div class="card-icon card-icon-remove">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                            <path d="M10 11v6M14 11v6"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="card-title">Remove</h2>
                        <p class="card-desc">Delete permanently</p>
                    </div>
                </div>
                <div class="card-body">
                    <button onclick="ui.openSelector('remove-team')" class="btn-danger">Team</button>
                    <button onclick="ui.openSelector('remove-club')" class="btn-danger">Club</button>
                    <button onclick="ui.openSelector('remove-player')" class="btn-danger">Player</button>
                    <button onclick="ui.openSelector('remove-match')" class="btn-danger">Match</button>
                    <button onclick="ui.openSelector('remove-tournament')" class="btn-danger">Tournament</button>
                </div>
            </div>

        </section>

        <!-- ============ FOOTER ============ -->
        <footer class="mt-auto pt-5 border-t border-slate-800/60 flex flex-col sm:flex-row items-center justify-between gap-2">
            <span class="text-slate-500">© Tchoukball Stats Platform</span>
            <span id="status-bar" class="text-indigo-400 font-medium">Ready.</span>
        </footer>

    </div>

    <!-- ============ MODAL ============ -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/85 hidden z-50 flex items-center justify-center p-4">
        <div id="modal-card" class="glass-card rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl border border-slate-700/80">
            <div class="px-6 py-4 border-b border-slate-800/80 flex items-center justify-between bg-slate-900/40">
                <h3 id="modal-title" class="text-base font-bold text-white tracking-tight">Modal Title</h3>
                <button onclick="ui.closeModal()" class="w-8 h-8 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition" aria-label="Close">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto flex-grow text-sm">
            </div>
        </div>
    </div>

    <!-- ============ CONTEXT MENU ============ -->
    <div id="context-menu" class="fixed hidden z-50 glass-card rounded-xl border border-slate-700/80 shadow-2xl py-1.5 w-52 context-menu-animate">
        <div class="px-3 py-1.5 text-[10px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800/80 mb-1">
            Player Options
        </div>
        <button id="ctx-btn-profile" class="w-full text-left px-3.5 py-2 text-xs text-slate-200 hover:bg-indigo-600/25 hover:text-indigo-200 transition font-medium">
            View Full Profile
        </button>
        <button id="ctx-btn-edit" class="w-full text-left px-3.5 py-2 text-xs text-slate-200 hover:bg-amber-600/25 hover:text-amber-200 transition font-medium">
            Edit Player Details
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
